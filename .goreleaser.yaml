version: 2

project_name: factorio-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: factorio-mcp
    main: ./cmd/factorio-mcp
    binary: factorio-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: factorio-mcp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  name_template: "v{{ .Version }}"

brews:
  - name: factorio-mcp
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/danielriddell21/factorio-mcp
    description: "A Claude Code plugin that lets Claude play Factorio 2.0"
    license: MIT
    commit_msg_template: "Brew formula update for factorio-mcp {{ .Tag }}"
    install: |
      bin.install "factorio-mcp"
